<script>
(function () {
  var box = document.getElementById('shower');
  var ko = document.getElementById('swKo'), zh = document.getElementById('swZh');
  var last = null;
  function open(el) {
    last = el;
    ko.textContent = el.dataset.ko;
    zh.textContent = el.dataset.zh;
    box.setAttribute('open', '');
    document.getElementById('swClose').focus();
  }
  function close() { box.removeAttribute('open'); if (last) last.focus(); }
  document.querySelectorAll('.ph').forEach(function (el) {
    el.addEventListener('click', function () { open(el); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(el); }
    });
  });
  document.getElementById('swClose').addEventListener('click', close);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && box.hasAttribute('open')) close();
  });
})();
</script>

<script>
(function () {
  var btn = document.getElementById('themebtn');
  if (!btn) return;
  var label = btn.querySelector('.tlabel');
  function paint() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    btn.firstChild.nodeValue = light ? '☀︎' : '🌙';
    label.textContent = light ? '亮色' : '暗色';
  }
  btn.addEventListener('click', function () {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    if (light) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'light');
    try { localStorage.setItem('seoul-theme', light ? 'dark' : 'light'); } catch (e) {}
    paint();
  });
  paint();
})();
</script>
