<script>
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var cards = Array.prototype.slice.call(document.querySelectorAll('.daycard'));
  var groups = Array.prototype.slice.call(document.querySelectorAll('.dayg'));
  var flows = Array.prototype.slice.call(document.querySelectorAll('.dayflow'));

  function setDay(d) {
    document.documentElement.setAttribute('data-day', d);
    tabs.forEach(function (t) { t.setAttribute('aria-pressed', String(t.dataset.day === d)); });
    cards.forEach(function (c) { c.hidden = !(d === 'all' || c.dataset.day === d); });
    /* 換天時把已展開的說明收起來 */
    document.querySelectorAll('.stopinfo[open]').forEach(function (x) { x.open = false; });
    groups.forEach(function (g) { g.classList.toggle('dim', !(d === 'all' || g.dataset.day === d)); });
    flows.forEach(function (f) { f.hidden = !(d === 'all' || f.dataset.day === d); });
  }

  window.__setDay = setDay;
  setDay('all');

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () {
      var cur  = document.documentElement.getAttribute('data-day');
      var back = (cur === t.dataset.day);            // 再點一次 → 還原五天
      setDay(back ? 'all' : t.dataset.day);

      var bar = document.querySelector('.tabsbar');
      var off = (bar ? bar.getBoundingClientRect().height : 0) + 14;
      var target;
      if (back) {
        /* 還原五天 → 回到行程路線地圖 */
        var rb = document.querySelector('.modebtn[data-mode="route"]');
        if (rb && rb.getAttribute('aria-pressed') !== 'true') rb.click();
        target = document.querySelector('.mapmodes') || document.querySelector('.mapcard');
      } else {
        target = document.querySelector('.daycard[data-day="' + t.dataset.day + '"]');
      }
      if (!target) return;
      window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - off,
                        behavior: 'smooth' });
    });
    t.addEventListener('keydown', function (e) {
      var n = null;
      if (e.key === 'ArrowRight') n = tabs[(i + 1) % tabs.length];
      if (e.key === 'ArrowLeft')  n = tabs[(i - 1 + tabs.length) % tabs.length];
      if (n) { e.preventDefault(); n.focus(); setDay(n.dataset.day); }
    });
  });

  // clicking a day card header jumps to that day's filtered view
  cards.forEach(function (c) {
    c.querySelector('.dhead').addEventListener('click', function () {
      setDay(c.dataset.day);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    c.querySelector('.dhead').style.cursor = 'pointer';
  });
})();
</script>

<script>
(function () {
  var btn = document.getElementById('themebtn');
  if (!btn) return;
  var label = btn.querySelector('.tlabel');
  function paint() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    btn.firstChild.nodeValue = light ? '☀\uFE0E' : '🌙';
    label.textContent = light ? '亮色' : '暗色';
    btn.setAttribute('aria-label', light ? '目前亮色，點擊切換暗色' : '目前暗色，點擊切換亮色');
  }
  btn.addEventListener('click', function () {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    if (light) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'light');
    try { localStorage.setItem('seoul-theme', light ? 'dark' : 'light'); } catch (e) {}
    paint();
  });
  paint();
})();
</script>

<script>
/* map pin tooltip */
(function () {
  document.querySelectorAll('.mapcard').forEach(function (card) {
    var tip = document.createElement('div');
    tip.className = 'maptip';
    card.appendChild(tip);
    function show(pin) {
      var n = pin.getAttribute('data-name'); if (!n) return;
      tip.innerHTML = '';
      tip.appendChild(document.createTextNode(n));
      var meta = pin.getAttribute('data-time');
      if (meta) {
        var s = document.createElement('span');
        s.className = 'ttmeta';
        var d = pin.getAttribute('data-d'), o = pin.getAttribute('data-ord');
        s.textContent = (d && d !== '0' ? 'DAY ' + d + ' 第 ' + o + ' 站 · ' : '') + meta;
        tip.appendChild(s);
      }
      var pr = pin.getBoundingClientRect(), cr = card.getBoundingClientRect();
      tip.style.left = (pr.left - cr.left + pr.width / 2) + 'px';
      tip.style.top  = (pr.top - cr.top - 8) + 'px';
      tip.classList.add('on');
    }
    function hide() { tip.classList.remove('on'); }
    card.querySelectorAll('.pin').forEach(function (pin) {
      pin.addEventListener('mouseenter', function () { show(pin); });
      pin.addEventListener('mouseleave', hide);
      pin.addEventListener('click', function (e) {
        e.stopPropagation();
        show(pin);
        var target = pin.getAttribute('data-stop');
        if (target && typeof window.__gotoStop === 'function') {
          setTimeout(function () { window.__gotoStop(target); }, 120);
        }
      });
    });
    document.addEventListener('click', hide);
    card.addEventListener('scroll', hide, true);
  });
})();

/* quick find */
(function () {
  var qfs = Array.prototype.slice.call(document.querySelectorAll('.qf'));
  if (!qfs.length) return;
  qfs.forEach(function (d) {
    d.addEventListener('toggle', function () {
      if (d.open) qfs.forEach(function (o) { if (o !== d) o.open = false; });
    });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.quickfind')) qfs.forEach(function (d) { d.open = false; });
  });

  document.querySelectorAll('.qf button[data-target]').forEach(function (b) {
    b.addEventListener('click', function () {
      var row = document.getElementById(b.dataset.target);
      if (!row) return;
      var card = row.closest('.daycard');
      if (card && card.hidden && typeof window.__setDay === 'function') window.__setDay(card.dataset.day);
      qfs.forEach(function (d) { d.open = false; });
      var det = row.querySelector('.stopinfo');
      if (det) det.open = true;
      if (typeof window.__markStation === 'function') window.__markStation(row.dataset.station);
      /* getBoundingClientRect forces a reflow, so the day switch is already applied */
      var y = row.getBoundingClientRect().top + window.scrollY - 84;
      window.scrollTo({ top: y, behavior: 'smooth' });
      row.classList.remove('flash');
      void row.offsetWidth;
      row.classList.add('flash');
      setTimeout(function () { row.classList.remove('flash'); }, 1900);
    });
  });
})();
</script>

<script>
/* 點任一行程列，也在地鐵圖標出該站 */
(function () {
  document.querySelectorAll('.tr.stop[data-station]').forEach(function (row) {
    row.addEventListener('click', function () {
      if (typeof window.__markStation === 'function') window.__markStation(row.dataset.station);
    });
  });
})();

/* 路線圖 / 地鐵圖 切換 */
(function () {
  var card = document.querySelector('.mapcard');
  if (!card) return;
  var btns = Array.prototype.slice.call(document.querySelectorAll('.modebtn'));
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      card.setAttribute('data-mode', b.dataset.mode);
      btns.forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
    });
  });
  /* 點選行程時，在地鐵圖標出該站 */
  /* 共用：跳到某筆行程並震動提示 */
  window.__gotoStop = function (stopId) {
    var row = document.getElementById(stopId);
    if (!row) return;
    var dc = row.closest('.daycard');
    if (dc && dc.hidden && typeof window.__setDay === 'function') window.__setDay(dc.dataset.day);
    var det = row.querySelector('.stopinfo');
    if (det) det.open = true;
    var y = row.getBoundingClientRect().top + window.scrollY - 84;
    window.scrollTo({ top: y, behavior: 'smooth' });
    /* 標題與說明視窗一起震動 2 秒 */
    [row.querySelector('.tn'), det].forEach(function (el) {
      if (!el) return;
      el.classList.remove('nudge');
      void el.offsetWidth;
      el.classList.add('nudge');
      setTimeout(function () { el.classList.remove('nudge'); }, 2100);
    });
    if (navigator.vibrate) { try { navigator.vibrate([30, 60, 30]); } catch (e) {} }
  };

  window.__markStation = function (zh) {
    document.querySelectorAll('.mstation.pick').forEach(function (g) { g.classList.remove('pick'); });
    if (!zh) return;
    var hit = document.querySelector('.mstation[data-zh="' + zh + '"]');
    if (!hit) return;
    hit.classList.add('pick');
    /* 地鐵圖比螢幕寬，把該站橫向捲到畫面中央 */
    var sc = document.querySelector('.mapscroll');
    if (!sc || sc.scrollWidth <= sc.clientWidth) return;
    var hr = hit.getBoundingClientRect(), sr = sc.getBoundingClientRect();
    var delta = (hr.left + hr.width / 2) - (sr.left + sr.width / 2);
    var left = Math.max(0, Math.min(sc.scrollWidth - sc.clientWidth, sc.scrollLeft + delta));
    if (sc.scrollTo) sc.scrollTo({ left: left, behavior: 'smooth' });
    else sc.scrollLeft = left;
  };
})();
</script>

<script>
/* 行程 ⇄ 地鐵圖 來回導覽 */
(function () {
  var card = document.querySelector('.mapcard');
  var fab  = document.getElementById('backfab');
  var name = document.getElementById('backname');
  if (!card || !fab) return;
  var lastStop = null;

  function goTo(el, offset) {
    var y = el.getBoundingClientRect().top + window.scrollY - (offset || 84);
    window.scrollTo({ top: y, behavior: 'smooth' });
  }

  document.querySelectorAll('.tometro').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      lastStop = b.dataset.stop;
      name.textContent = '回到 ' + b.dataset.label;
      fab.dataset.show = '1';
      /* 切到地鐵圖並標出該站 */
      var mb = document.querySelector('.modebtn[data-mode="metro"]');
      if (mb) mb.click();
      if (typeof window.__markStation === 'function') window.__markStation(b.dataset.station);
      goTo(document.querySelector('.mapmodes'), 12);
    });
  });

  /* 換到別天時，返回鈕就沒有意義了，自動收起 */
  new MutationObserver(function () {
    if (!lastStop || fab.dataset.show !== '1') return;
    var row = document.getElementById(lastStop);
    var dc  = row && row.closest('.daycard');
    var cur = document.documentElement.getAttribute('data-day');
    if (dc && cur !== 'all' && dc.dataset.day !== cur) {
      fab.dataset.show = '0';
      lastStop = null;
    }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-day'] });

  fab.addEventListener('click', function () {
    var row = lastStop && document.getElementById(lastStop);
    if (!row) { fab.dataset.show = '0'; return; }
    if (typeof window.__gotoStop === 'function') window.__gotoStop(lastStop);
    fab.dataset.show = '0';
  });
})();
</script>

<script>
/* 手指左右滑切換天數 */
(function () {
  var box = document.getElementById('cards');
  if (!box) return;
  var x0 = 0, y0 = 0, on = false;
  box.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { on = false; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; on = true;
  }, { passive: true });
  box.addEventListener('touchend', function (e) {
    if (!on) return; on = false;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;  /* 需明顯橫向 */
    var cur = document.documentElement.getAttribute('data-day');
    if (cur === 'all') return;                       /* 全部檢視時不攔截 */
    var n = parseInt(cur, 10) + (dx < 0 ? 1 : -1);
    if (n < 1 || n > 5) return;
    var tab = document.querySelector('.tab[data-day="' + n + '"]');
    if (!tab) return;
    if (typeof window.__setDay === 'function') window.__setDay(String(n));
    document.querySelectorAll('.tab').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b === tab));
    });
    var bar = document.querySelector('.tabsbar');
    var off = (bar ? bar.getBoundingClientRect().height : 0) + 14;
    var card = document.querySelector('.daycard[data-day="' + n + '"]');
    if (card) window.scrollTo({ top: card.getBoundingClientRect().top + window.scrollY - off,
                                behavior: 'smooth' });
    tab.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    if (navigator.vibrate) { try { navigator.vibrate(20); } catch (err) {} }
  }, { passive: true });
})();
</script>

<script>
/* 有裝 Naver 地圖 App 就直接交給 App；全程不開新分頁 */
(function () {
  var touch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (!touch) return;
  document.querySelectorAll('a[data-nmap]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      var deep = a.getAttribute('data-nmap');
      if (!deep) return;
      e.preventDefault();
      var web = a.href, left = false;
      function bye() { left = true; }
      window.addEventListener('pagehide', bye);
      window.addEventListener('blur', bye);
      document.addEventListener('visibilitychange', bye);
      window.location.href = deep;             /* App 接手後本頁原地保留 */
      setTimeout(function () {                 /* 沒接手才在同一分頁退回網頁版 */
        window.removeEventListener('pagehide', bye);
        window.removeEventListener('blur', bye);
        document.removeEventListener('visibilitychange', bye);
        if (!left && !document.hidden) window.location.href = web;
      }, 1400);
    });
  });
})();
</script>

<script>
/* 從路線全圖點「看行程」進來：自動篩選該天並捲到位置 */
(function () {
  var m = /^#day([1-5])$/.exec(window.location.hash || '');
  if (!m) return;
  var d = m[1];
  if (typeof window.__setDay === 'function') window.__setDay(d);
  document.querySelectorAll('.tab').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.day === d));
  });
  var card = document.querySelector('.daycard[data-day="' + d + '"]');
  if (!card) return;
  /* 定位交給瀏覽器的錨點機制（CSS scroll-margin-top 已避開黏性列），
     主視覺載入後版面高度會變，載完再校正一次 */
  function land() { card.scrollIntoView({ block: 'start', behavior: 'auto' }); }
  land();
  window.addEventListener('load', land);
})();
</script>
