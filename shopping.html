  :root {
    --bg: #F2F3F5;
    --card: #FFFFFF;
    --card-2: #F7F8FA;
    --ink: #16181D;
    --ink-soft: #545B66;
    --ink-faint: #868D99;
    --line: #E3E6EB;
    --line-2: #CFD4DC;

    --d1: #D14A2F;
    --d2: #147A5C;
    --d3: #7B4BB8;
    --d4: #B07310;
    --d5: #1F6FD0;
    --pin-ink: #FFFFFF;

    --mapbg: #FFFFFF;
    --mapfield: #F4F6F8;
    --water: #D3E3EC;
    --water-edge: #B4CEDC;

    --sight: #1F6FD0;  --sight-bg: #E8F0FB;
    --food:  #C4442C;  --food-bg:  #FBEAE6;
    --cafe:  #9A6510;  --cafe-bg:  #FAF0DC;
    --shop:  #7B4BB8;  --shop-bg:  #F1EAFA;
    --stay:  #4A5260;  --stay-bg:  #EDEFF2;

    --shadow-s: 0 1px 2px rgba(16,18,24,.05);
    --shadow-m: 0 1px 3px rgba(16,18,24,.06), 0 10px 28px -14px rgba(16,18,24,.22);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216;
      --card: #191C22;
      --card-2: #20242B;
      --ink: #E9ECF1;
      --ink-soft: #A3ABB8;
      --ink-faint: #767E8B;
      --line: #2A2F37;
      --line-2: #3A4048;

      --d1: #F0836C;
      --d2: #4FC49E;
      --d3: #B695E8;
      --d4: #E8B45A;
      --d5: #6BA6F5;
      --pin-ink: #10131A;

      --mapbg: #191C22;
      --mapfield: #14171C;
      --water: #1D2E38;
      --water-edge: #2C4552;

      --sight: #6BA6F5;  --sight-bg: #172436;
      --food:  #F0836C;  --food-bg:  #2E1D19;
      --cafe:  #E8B45A;  --cafe-bg:  #2E2617;
      --shop:  #B695E8;  --shop-bg:  #241C33;
      --stay:  #A3ABB8;  --stay-bg:  #23272E;

      --shadow-s: 0 1px 2px rgba(0,0,0,.4);
      --shadow-m: 0 1px 3px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101216;
    --card: #191C22;
    --card-2: #20242B;
    --ink: #E9ECF1;
    --ink-soft: #A3ABB8;
    --ink-faint: #767E8B;
    --line: #2A2F37;
    --line-2: #3A4048;

    --d1: #F0836C;
    --d2: #4FC49E;
    --d3: #B695E8;
    --d4: #E8B45A;
    --d5: #6BA6F5;
    --pin-ink: #10131A;

    --mapbg: #191C22;
    --mapfield: #14171C;
    --water: #1D2E38;
    --water-edge: #2C4552;

    --sight: #6BA6F5;  --sight-bg: #172436;
    --food:  #F0836C;  --food-bg:  #2E1D19;
    --cafe:  #E8B45A;  --cafe-bg:  #2E2617;
    --shop:  #B695E8;  --shop-bg:  #241C33;
    --stay:  #A3ABB8;  --stay-bg:  #23272E;

    --shadow-s: 0 1px 2px rgba(0,0,0,.4);
    --shadow-m: 0 1px 3px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC",
                 "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 72px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* ---------- header ---------- */
  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 {
    font-family: 'BigShoulders', -apple-system, sans-serif; font-weight: 800;
    font-size: clamp(34px, 6vw, 46px); line-height: .9; letter-spacing: .01em; margin: 0;
  }
  .brand .kr { font-size: 15px; font-weight: 600; color: var(--ink-faint); letter-spacing: .04em; }
  .navlink {
    font-size: 13px; color: var(--ink-soft); text-decoration: none;
    border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 12px; background: var(--card);
    white-space: nowrap;
  }
  .navlink:hover { border-color: var(--ink-faint); color: var(--ink); }
  .subline { margin: 8px 0 0; font-size: 14px; color: var(--ink-soft); }
  .subline strong { color: var(--ink); font-weight: 600; }

  /* ---------- flights ---------- */
  .flights { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0 0; }
  @media (max-width: 620px) { .flights { grid-template-columns: 1fr; } }
  .fl {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; box-shadow: var(--shadow-s);
    display: flex; align-items: center; gap: 14px;
  }
  .fl .dir {
    font-family: 'BigShoulders', sans-serif; font-weight: 800; font-size: 11px;
    letter-spacing: .12em; color: var(--ink-faint); writing-mode: vertical-rl; text-orientation: mixed;
  }
  .fl .leg { display: flex; align-items: center; gap: 10px; flex: 1; }
  .fl .ap { text-align: center; }
  .fl .ap .code, .fl .ap .tm, .fl .ap .nm { display: block; white-space: nowrap; }
  .fl .ap .code { font-family: 'BigShoulders', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.05; }
  .fl .ap .tm { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fl .ap .nm { font-size: 10.5px; color: var(--ink-faint); }
  .fl .dash { flex: 1; height: 1px; background: var(--line-2); position: relative; min-width: 26px; }
  .fl .dash::after {
    content: "✈"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: var(--card); padding: 0 4px; font-size: 11px; color: var(--ink-faint);
  }
  .fl .fdate { font-size: 11px; color: var(--ink-faint); white-space: nowrap; }

  /* ---------- day tabs ---------- */
  .tabsbar {
    position: sticky; top: 0; z-index: 20; margin: 26px -20px 0; padding: 10px 20px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: flex; align-items: center; gap: 8px;
    font: inherit; font-size: 13px; color: var(--ink-soft); cursor: pointer;
    background: var(--card); border: 1px solid var(--line-2); border-radius: 999px;
    padding: 7px 15px 7px 10px; transition: none;
  }
  .tab .tdot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--ink-faint)); flex: none; }
  .tab .tlab { font-weight: 600; color: var(--ink); }
  .tab .tsub { color: var(--ink-faint); font-size: 12px; }
  .tab:hover { border-color: var(--ink-faint); }
  .tab[aria-selected="true"] {
    background: var(--c, var(--ink)); border-color: var(--c, var(--ink));
  }
  .tab[aria-selected="true"] .tlab,
  .tab[aria-selected="true"] .tsub { color: var(--pin-ink); }
  .tab[aria-selected="true"] .tdot { background: var(--pin-ink); }
  .tab:focus-visible { outline: 2px solid var(--d5); outline-offset: 2px; }

  /* ---------- map ---------- */
  .mapcard {
    background: var(--mapbg); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; box-shadow: var(--shadow-m); margin: 22px 0 0; position: relative;
  }
  .mapscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .mapcard svg { width: 100%; height: auto; display: block; min-width: 660px; }
  .pnum {
    font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700;
    fill: var(--pin-ink); pointer-events: none;
  }
  .dayg { transition: opacity .18s ease; }
  .dayg.dim { opacity: .12; }
  @media (prefers-reduced-motion: reduce) { .dayg { transition: none; } }
  .anchor-t { fill: var(--card); }
  .anchor-l {
    font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 700;
    fill: var(--ink-faint); letter-spacing: .06em;
  }
  .maplabel { font-size: 11px; fill: var(--ink-faint); font-weight: 600; letter-spacing: .03em; }
  .rivertext { font-family: ui-monospace, monospace; font-size: 10.5px; fill: var(--water-edge); letter-spacing: .12em; }
  .mapcap { font-size: 11.5px; color: var(--ink-faint); margin: 12px 4px 0; }

  .inset {
    position: absolute; right: 24px; top: 24px; max-width: 196px;
    background: var(--card); border: 1px solid var(--line-2); border-radius: 10px;
    padding: 10px 13px; box-shadow: var(--shadow-s);
  }
  :root[data-day="3"] .inset {
    border-color: var(--d3);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--d3) 22%, transparent);
  }
  .inset .ih { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; color: var(--d3); }
  .inset .ib {
    width: 19px; height: 19px; border-radius: 50%; background: var(--d3); color: var(--pin-ink);
    font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .inset p { margin: 5px 0 0; font-size: 11.5px; color: var(--ink-soft); line-height: 1.45; }

  /* ---------- day cards ---------- */
  .cards { display: flex; flex-direction: column; gap: 18px; margin-top: 26px; }
  .daycard {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow-m); overflow: hidden;
    border-top: 3px solid var(--c);
  }
  .daycard[hidden] { display: none; }
  .dhead { display: flex; align-items: center; gap: 14px; padding: 16px 20px 12px; }
  .dnum {
    font-family: 'BigShoulders', sans-serif; font-weight: 800; font-size: 30px; line-height: 1;
    width: 46px; height: 46px; border-radius: 11px; background: var(--c); color: var(--pin-ink);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .dmeta { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .ddate {
    font-family: ui-monospace, monospace; font-size: 11.5px; letter-spacing: .06em;
    color: var(--c); font-weight: 700;
  }
  .dtheme { font-size: 17px; font-weight: 700; text-wrap: balance; }
  .dcount {

  </footer>

</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="商品照片">
  <button class="lbclose" id="lbclose" type="button" aria-label="關閉">×</button>
  <img id="lbimg" src="" alt="">
</div>

<script>
(function () {
  var KEY = 'seoul-shopping-v1';
  var boxes = Array.prototype.slice.call(document.querySelectorAll('input[type=checkbox][data-id]'));
  var doneEl = document.getElementById('done');
  var fill = document.getElementById('barfill');

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { return {}; }
  }
  function save(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = load();

  function refresh() {
    var done = boxes.filter(function (b) { return b.checked; }).length;
    doneEl.textContent = done;
    fill.style.width = boxes.length ? (done / boxes.length * 100) + '%' : '0%';

    document.querySelectorAll('.shopsec').forEach(function (sec) {
      var bs = sec.querySelectorAll('input[type=checkbox]');
      var d = sec.querySelectorAll('input[type=checkbox]:checked').length;
      sec.querySelector('.sdone').textContent = d;
      sec.setAttribute('data-complete', String(d === bs.length && bs.length > 0));
    });
  }

  boxes.forEach(function (b) {
    b.checked = !!state[b.dataset.id];
    b.addEventListener('change', function () {
      state[b.dataset.id] = b.checked;
      save(state);
      refresh();
    });
  });
  refresh();

  document.getElementById('reset').addEventListener('click', function () {
    boxes.forEach(function (b) { b.checked = false; });
    state = {};
    save(state);
    refresh();
  });

  // lightbox
  var lb = document.getElementById('lb');
  var lbimg = document.getElementById('lbimg');
  var lastFocus = null;
  function openLb(src, alt) {
    lastFocus = document.activeElement;
    lbimg.src = src; lbimg.alt = alt;
    lb.setAttribute('open', '');
    document.getElementById('lbclose').focus();
  }
  function closeLb() {
    lb.removeAttribute('open'); lbimg.src = '';
    if (lastFocus) lastFocus.focus();
  }
  document.querySelectorAll('.thumb').forEach(function (t) {
    t.addEventListener('click', function () {
      var im = t.querySelector('img');
      openLb(im.src, im.alt);
    });
  });
  document.getElementById('lbclose').addEventListener('click', closeLb);
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && lb.hasAttribute('open')) closeLb();
  });
})();
</script>
